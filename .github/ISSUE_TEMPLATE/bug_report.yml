name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, host, and Node.js versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps and observed behavior, with secrets removed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

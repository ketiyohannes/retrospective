name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify packaged plugin is current
        run: git diff --exit-code -- plugins/retrospective
